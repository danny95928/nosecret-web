<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Insight | 双瀑布数字花园</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX for beautiful Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body { 
            margin: 0; 
            background-color: #fafaf9; 
            color: #333333; 
            overflow: hidden; /* 锁定主屏幕滚动，依靠内部区域滚动 */
            font-family: 'Noto Serif SC', serif; 
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* 极简粒子背景 */
        #particle-canvas { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3;
        }

        /* 优雅的自定义滚动条 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

        /* 左侧卡片样式 */
        .note-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid #e5e7eb;
            border-left: 3px solid #d1d5db;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .note-card:hover, .note-card.active {
            border-left-color: #0ea5e9;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transform: translateX(4px);
        }

        /* 右侧瀑布流连线样式 ( Timeline ) */
        .step-container { position: relative; padding-left: 2.5rem; margin-bottom: 2rem; }
        .step-container::before {
            content: '';
            position: absolute;
            left: 0.75rem;
            top: 2rem;
            bottom: -2rem;
            width: 2px;
            background: #e5e7eb;
        }
        .step-container:last-child::before { display: none; }
        
        .step-icon {
            position: absolute;
            left: 0;
            top: 0;
            width: 1.5rem;
            height: 1.5rem;
            background: #f8fafc;
            border: 2px solid #94a3b8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #475569;
        }

        /* 数学公式展示框 */
        .math-box {
            background: #fefefe;
            border: 1px dashed #cbd5e1;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 0.75rem;
            color: #1e293b;
            font-size: 1.05rem;
        }
    </style>
</head>
<body class="antialiased h-screen flex flex-col">

    <canvas id="particle-canvas"></canvas>

    <!-- 顶部导航 -->
    <nav class="w-full px-8 py-6 flex justify-between items-baseline border-b border-stone-200/60 bg-white/50 backdrop-blur-sm z-10 shrink-0">
        <div>
            <a href="#" class="text-xl font-black tracking-widest text-stone-800 no-underline">Fluid Insight</a>
            <span class="ml-3 text-xs text-stone-500 font-mono hidden sm:inline-block">/ Digital Garden</span>
        </div>
        <div class="text-xs text-stone-500 font-mono">
            <span>[ MACRO_MICRO_TRANSITIONS ]</span>
        </div>
    </nav>

    <!-- 双瀑布流工作区 -->
    <main class="flex-1 w-full max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-8 p-6 overflow-hidden">
        
        <!-- 左侧瀑布区：卡片索引 (按离散到连续深度排列) -->
        <div class="md:col-span-4 h-full overflow-y-auto custom-scrollbar pr-2 pb-10 space-y-4" id="index-list">
            <h2 class="text-sm font-bold text-stone-400 font-mono tracking-widest mb-6"># EVOLUTION_PATH</h2>
            <!-- 卡片由 JS 动态渲染 -->
        </div>

        <!-- 右侧瀑布区：动态数学推导展示 -->
        <div class="md:col-span-8 h-full overflow-y-auto custom-scrollbar bg-white/80 backdrop-blur-md border border-stone-200 rounded-2xl p-8 shadow-sm" id="detail-view">
            <!-- 初始占位提示 -->
            <div class="h-full flex flex-col items-center justify-center text-stone-400">
                <svg class="w-12 h-12 mb-4 text-stone-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                <p class="font-mono text-sm">选择左侧笔记，展开数学演变过程</p>
            </div>
        </div>
    </main>

    <script>
        // 定义数据结构：按照 离散 -> 粗粒化 -> 连续 的逻辑
        const noteData = [
            {
                id: 1,
                date: "2026-03-15",
                tag: "Probability & Stochastics",
                title: "1. 离散随机步与 Fokker-Planck",
                desc: "追踪微观粒子的 Master Equation，通过 Kramers-Moyal 截断逼近连续概率场。",
                details: {
                    title: "从离散跳跃到连续概率场",
                    intro: "当系统中粒子数量激增时，精确追踪每一个离散跳跃概率会导致状态空间爆炸。大数定律允许我们将其平滑化。",
                    steps: [
                        {
                            icon: "●", 
                            label: "[ 微观/离散 ] 主方程 (Master Equation)",
                            text: "系统在离散状态间的随机跳跃，基于转移概率 $W(x|x')$ 描述状态演化：",
                            math: "$$ \\frac{\\partial P(x,t)}{\\partial t} = \\int [W(x|x')P(x',t) - W(x'|x)P(x,t)] dx' $$"
                        },
                        {
                            icon: "∫", 
                            label: "[ 中间态/粗粒化 ] Kramers-Moyal 展开",
                            text: "将跳跃距离作为微小量进行泰勒展开，定义跳跃矩（Moments）：",
                            math: "$$ \\frac{\\partial P(x,t)}{\\partial t} = \\sum_{n=1}^{\\infty} \\frac{(-1)^n}{n!} \\frac{\\partial^n}{\\partial x^n} [D_n(x) P(x,t)] $$"
                        },
                        {
                            icon: "≈", 
                            label: "[ 宏观/连续 ] 截断与 PDE",
                            text: "忽略高阶矩，只保留漂移项 $D_1$ 和扩散项 $D_2$，得到宏观平滑偏微分方程：",
                            math: "$$ \\frac{\\partial P}{\\partial t} = -\\frac{\\partial}{\\partial x} (D_1(x) P) + \\frac{\\partial^2}{\\partial x^2} (D_2(x) P) $$"
                        }
                    ]
                }
            },
            {
                id: 2,
                date: "2026-03-20",
                tag: "CFD & Rheology",
                title: "2. 凝胶网络至 Herschel-Bulkley",
                desc: "PCP (Personal Care Products) 制造中的多相流混合，从分子网状断裂到 CFD 本构。",
                details: {
                    title: "复杂层状凝胶网络的宏观本构转化",
                    intro: "在模拟 Personal Care Products (PCP) 反应釜内的非牛顿流体时，OpenFOAM 无法追踪局部胶束网络的断裂。我们需要将其均质化。",
                    steps: [
                        {
                            icon: "☍", 
                            label: "[ 微观/离散 ] 局部应力交互",
                            text: "由范德华力和高分子纠缠构成的离散微观粒子网络，其局部屈服取决于单键能量：",
                            math: "$$ \\tau_{local} = \\sum_{i,j} \\mathbf{F}_{ij} \\cdot \\mathbf{r}_{ij} \\quad \\text{(在极小尺度发生断裂)} $$"
                        },
                        {
                            icon: "⟨⟩", 
                            label: "[ 中间态/粗粒化 ] 均场近似与时间平均",
                            text: "在表征体积元 (RVE) 内，将离散的屈服事件平均为连续的概率分布，建立剪切率 $\\dot{\\gamma}$ 与整体结构的关联：",
                            math: "$$ \\langle \\tau \\rangle = \\tau_{yield} + \\lim_{V \\to \\infty} \\frac{1}{V} \\int_V \\eta_{local}(\\dot{\\gamma}) \\nabla \\mathbf{u} \\, dV $$"
                        },
                        {
                            icon: "〰", 
                            label: "[ 宏观/连续 ] Herschel-Bulkley 方程",
                            text: "最终在 CFD 网格中，体现为含有屈服应力 $\\tau_0$ 和稠度系数 $k$ 的连续张量场：",
                            math: "$$ \\boldsymbol{\\tau} = \\left( \\frac{\\tau_0}{|\\dot{\\gamma}|} + k |\\dot{\\gamma}|^{n-1} \\right) \\dot{\\boldsymbol{\\gamma}} $$"
                        }
                    ]
                }
            },
            {
                id: 3,
                date: "2026-04-05",
                tag: "Control Systems",
                title: "3. 智能体博弈至均场控制 (MFC)",
                desc: "从离散个体的高维纳什均衡，塌缩为 HJB 与 FP 耦合方程场。",
                details: {
                    title: "控制理论的降维：平均场博弈",
                    intro: "当系统存在成千上万个自主优化的智能体时，求解联合纳什均衡是 NP-Hard。通过连续化概率密度，实现了解耦。",
                    steps: [
                        {
                            icon: "i", 
                            label: "[ 微观/离散 ] N-智能体耦合控制",
                            text: "每个个体 $i$ 试图最小化代价函数，其状态不仅依赖于自己的策略 $u_i$，还受到其他 $N-1$ 个个体状态 $X_{-i}$ 影响：",
                            math: "$$ \\min_{u_i} \\mathbb{E} \\int_0^T L(X_i(t), u_i(t), \\frac{1}{N}\\sum_{j \\neq i} \\delta_{X_j(t)}) dt $$"
                        },
                        {
                            icon: "∞", 
                            label: "[ 中间态/粗粒化 ] 经验分布极限",
                            text: "当 $N \\to \\infty$ 时，个体不再关心具体某一个对手，而是响应整个群体的统计连续密度 $m(x,t)$：",
                            math: "$$ m^{(N)}(dx) = \\frac{1}{N}\\sum_{i=1}^N \\delta_{X_i}(dx) \\xrightarrow{\\text{Weakly}} m(x,t)dx $$"
                        },
                        {
                            icon: "∇", 
                            label: "[ 宏观/连续 ] 拉斯里-利翁偏微分方程组",
                            text: "离散优化塌缩为连续时空下的向后 HJB (价值函数 $u$) 与向前 FP (概率密度 $m$) 耦合 PDE：",
                            math: "$$ \\begin{cases} -\\partial_t u - \\nu \\Delta u + H(x, \\nabla u, m) = 0 \\\\ \\partial_t m - \\nu \\Delta m - \\text{div}(m D_p H(x, \\nabla u, m)) = 0 \\end{cases} $$"
                        }
                    ]
                }
            }
        ];

        // 渲染左侧卡片列表
        const indexList = document.getElementById('index-list');
        const detailView = document.getElementById('detail-view');
        let currentActiveId = null;

        function renderList() {
            noteData.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card rounded-lg';
                card.innerHTML = `
                    <div class="text-[10px] font-mono text-stone-400 mb-1 flex justify-between">
                        <span>${note.date}</span>
                        <span>[ ${note.tag} ]</span>
                    </div>
                    <h3 class="text-base font-bold mb-2 text-stone-800">${note.title}</h3>
                    <p class="text-xs text-stone-500 leading-relaxed">${note.desc}</p>
                `;
                card.onclick = () => renderDetail(note.id, card);
                indexList.appendChild(card);
            });
        }

        // 渲染右侧详情瀑布
        function renderDetail(id, cardElement) {
            // 更新活跃状态样式
            document.querySelectorAll('.note-card').forEach(el => el.classList.remove('active', 'border-sky-400'));
            cardElement.classList.add('active', 'border-sky-400');

            const note = noteData.find(n => n.id === id);
            if (!note) return;

            // 构建 HTML (时间轴瀑布流)
            let stepsHtml = '';
            note.details.steps.forEach(step => {
                stepsHtml += `
                    <div class="step-container">
                        <div class="step-icon shadow-sm">${step.icon}</div>
                        <h4 class="font-bold text-stone-800 text-sm mb-1">${step.label}</h4>
                        <p class="text-stone-600 text-sm mb-3">${step.text}</p>
                        <div class="math-box">
                            ${step.math}
                        </div>
                    </div>
                `;
            });

            detailView.innerHTML = `
                <div class="animate-[fadeIn_0.4s_ease-out]">
                    <div class="inline-block px-3 py-1 bg-stone-100 text-stone-500 font-mono text-[10px] rounded-full mb-4 uppercase tracking-wider">
                        ${note.tag}
                    </div>
                    <h2 class="text-2xl font-bold text-stone-800 mb-4">${note.details.title}</h2>
                    <p class="text-stone-600 text-[15px] mb-10 leading-relaxed bg-sky-50/50 p-4 border-l-4 border-sky-300 rounded-r-lg">
                        ${note.details.intro}
                    </p>
                    
                    <!-- 核心推导瀑布流区 -->
                    <div class="relative pt-2">
                        ${stepsHtml}
                    </div>
                </div>
            `;

            // 调用 KaTeX 解析生成的数学公式
            renderMathInElement(detailView, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError: false
            });
        }

        // 背景粒子动效
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            const count = Math.floor(window.innerWidth / 20);
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    radius: Math.random() * 1.2 + 0.3
                });
            }
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#94a3b8';
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.1)';

            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                for (let j = index + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 100) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawParticles);
        }

        // 初始化
        window.addEventListener('resize', initParticles);
        initParticles();
        drawParticles();
        renderList();
    </script>
</body>
</html>
